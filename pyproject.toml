[project]
name = "defossil"
version = "0.0.10"
description = "Improve your English by reviewing your own chats with AI coding agents."
readme = "README.md"
authors = [{ name = "pybass" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "fastapi==0.142.2",  # == pin: nothing imports an app, upgrades are deliberate edits
    "jinja2==3.1.6",
    "markupsafe==3.0.4",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[project.urls]
Repository = "https://github.com/pybass/defossil"
Issues = "https://github.com/pybass/defossil/issues"

[project.scripts]
defossil = "defossil.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]  # pinned: build backends live outside uv.lock
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff~=0.16.10",
    "mypy~=2.4.0",
    "pytest~=9.1.1",
    "pytest-xdist~=3.8.0",
    "pip-audit~=2.10.1",
    "pre-commit~=4.6.2",
    "watchfiles~=1.3.0",  # justfile `dev` auto-restart
]

[tool.uv]
required-version = ">=0.11"  # refuse a uv too old for the index/publish semantics we rely on
publish-url = "https://upload.pypi.org/legacy/"
check-url = "https://pypi.org/simple/"  # lets a failed release re-run: uploaded files are skipped

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Tool conflicts
    "COM812",   # trailing-comma — handled by ruff formatter
    "ISC001",   # implicit-string-concat — conflicts with ruff formatter
    "D203",     # conflicts with D211
    "D213",     # conflicts with D212
    # Style preferences
    "PLC0414",  # `import x as x` is our re-export marker
    "RET503",   # explicit None returns are noisy
    "G004",     # f-strings in logging are fine
    "PT001", "PT006", "PT007", "PT023",  # cosmetic pytest-style rules
    "D401",     # non-imperative-mood — fights noun-phrase docstrings (OpenAPI summaries) and fires inconsistently
    # Categories that fight our style
    "FIX",      # TODOs are fine
    "FBT",      # boolean-trap — too restrictive
    "EM",       # inline error messages are fine
    "CPY",      # no copyright headers — per-file headers add nothing
    "TC",       # TYPE_CHECKING blocks: import noise, break pydantic runtime annotations
    "TRY003",   # raise-vanilla-args — too noisy
    "C901",     # complexity — judgment call
    "PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004",  # soft pylint thresholds
    "TD002", "TD003",  # TODO author/link — optional
    "ASYNC109", # async-function-with-timeout — debatable
    "D1",       # no docstring-coverage mandate — a docstring is written only where it adds contract
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]  # N805: cls is correct without @classmethod

[tool.ruff.lint.pydocstyle]
ignore-decorators = ["typing.override", "typing.overload"]  # the base class / overload stub carries the contract

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S", "SLF"]  # tests skip annotation, assert/security, and private-access rules

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool", "exhaustive-match", "unused-awaitable"]

[[tool.mypy.overrides]]
module = "tests.*"  # relaxed so pytest fixtures don't fight you
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_unused_ignores = false

[tool.codespell]
skip = "uv.lock,.git,.venv,.mypy_cache,.ruff_cache,.pytest_cache,*.min.js"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
filterwarnings = ["error"]  # warnings are failures; targeted ignores go after "error"
